# PIN POINT REVIEW — 테스트 자동 실행 (push · PR)
#   sqlite  : 기본 테스트 (임시 SQLite 파일)
#   mariadb : 실제 MariaDB 11 컨테이너에서 같은 테스트 + Alembic 마이그레이션 확인
#   ※ CI 전용 계정·비밀번호이며 운영 DB 와 무관합니다. DB 이름은 conftest 규칙대로 _test 로 끝나야 함
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: pinpoint_test
          MARIADB_USER: pinpoint
          MARIADB_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mariadb+pymysql://pinpoint:ci-password@127.0.0.1:3306/pinpoint_test?charset=utf8mb4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # 모델과 마이그레이션의 일치 검사(alembic check)는 sqlite job 의 tests/test_migrations.py 에서 수행
      - name: Alembic — 빈 MariaDB 에 마이그레이션 적용 · 되돌리기
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
      - run: python -m pytest -q
