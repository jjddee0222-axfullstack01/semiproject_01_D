# Alembic config (DB schema history). Run from the backend folder:
#   python -m alembic upgrade head                        # apply all migrations (creates missing tables only)
#   python -m alembic revision --autogenerate -m "msg"    # after changing models.py
#   python -m alembic current                             # show the DB version
# DB connection comes from backend/.env (same as db.py), not from this file.
# NOTE: keep this file ASCII only. Alembic reads it with the OS default encoding
#       (cp949 on Korean Windows), so non-ASCII text here breaks every alembic command.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
