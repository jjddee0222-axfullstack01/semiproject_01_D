# Alembic 설정 (DB 구조 변경 이력 관리) — backend 폴더에서 실행
#   python -m alembic upgrade head                          # 최신 구조로 맞추기 (없는 테이블만 만듦)
#   python -m alembic revision --autogenerate -m "설명"      # models.py 를 바꾼 뒤 변경 파일 만들기
#   python -m alembic current                               # 지금 DB 의 버전 확인
# 접속 정보는 이 파일이 아니라 backend/.env (db.py 와 같은 값)에서 읽습니다.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
