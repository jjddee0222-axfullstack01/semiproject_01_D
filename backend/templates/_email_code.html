{# 이메일 인증 코드 입력 영역 (joinmembership.html · passwordreset.html 공용)
   사용: {% set code_purpose = 'signup' %}{% include '_email_code.html' %}  — 이메일 입력칸 id="email" 바로 아래에 둔다 #}
{% if email_verification %}
<div class="input-group email-code-group">
    <label for="email-code">이메일 인증 코드</label>
    <div class="code-row">
        <input type="text" id="email-code" name="email_code" inputmode="numeric" maxlength="6"
               autocomplete="one-time-code" placeholder="6자리 숫자" required>
        <button type="button" class="btn-code" id="btn-send-code" data-purpose="{{ code_purpose }}">인증 코드 받기</button>
    </div>
    <div class="code-hint" id="code-hint">이메일을 입력하고 '인증 코드 받기'를 눌러 주세요.</div>
</div>
<style>
    .code-row { display: flex; gap: 8px; }
    .code-row input { flex: 1; min-width: 0; letter-spacing: 2px; }
    .btn-code {
        flex-shrink: 0; padding: 0 14px; border: 1px solid #111111; border-radius: 8px;
        background: #ffffff; color: #111111; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-code:disabled { border-color: #CED4DA; color: #ADB5BD; cursor: default; }
    .code-hint { margin-top: 6px; font-size: 12px; color: #868E96; text-align: left; }
    .code-hint.ok { color: #2B8A3E; }
    .code-hint.bad { color: #E03131; }
    .code-hint .dev { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 6px;
                      background: #FFF9DB; color: #8F6A00; font-weight: 600; }
</style>
<script>
(() => {
    const button = document.getElementById("btn-send-code");
    const hint = document.getElementById("code-hint");
    let timer = null;
    function cooldown(seconds) {
        button.disabled = true;
        clearInterval(timer);
        timer = setInterval(() => {
            seconds -= 1;
            button.textContent = seconds > 0 ? `다시 받기 (${seconds}초)` : "다시 받기";
            if (seconds <= 0) { clearInterval(timer); button.disabled = false; }
        }, 1000);
    }
    button.addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) { hint.className = "code-hint bad"; hint.textContent = "이메일을 먼저 입력해 주세요."; return; }
        button.disabled = true;
        hint.className = "code-hint"; hint.textContent = "보내는 중…";
        try {
            const res = await fetch("{{ url_for('email_code') }}", {
                method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
                body: JSON.stringify({ purpose: button.dataset.purpose, email }),
            });
            const data = await res.json();
            hint.className = "code-hint " + (data.ok ? "ok" : "bad");
            hint.textContent = data.message;
            if (data.dev_code) {        // 메일 서버를 설정하지 않은 개발 모드에서만 코드가 내려옴
                const dev = document.createElement("div");
                dev.className = "dev";
                dev.textContent = `개발 모드 · 인증 코드: ${data.dev_code}`;
                hint.appendChild(document.createElement("br"));
                hint.appendChild(dev);
            }
            if (data.ok) { cooldown(60); document.getElementById("email-code").focus(); }
            else { button.disabled = false; }
        } catch (err) {
            hint.className = "code-hint bad"; hint.textContent = "요청에 실패했습니다. 잠시 후 다시 시도해 주세요.";
            button.disabled = false;
        }
    });
})();
</script>
{% endif %}
