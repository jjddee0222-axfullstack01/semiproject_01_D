{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div style="margin-bottom:16px;padding:12px 14px;border-radius:8px;font-size:14px;text-align:left;
                {% if category == 'error' %}background:#FFF5F5;color:#E03131;border:1px solid #FFC9C9;
                {% else %}background:#EBFBEE;color:#2B8A3E;border:1px solid #B2F2BB;{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endwith %}
