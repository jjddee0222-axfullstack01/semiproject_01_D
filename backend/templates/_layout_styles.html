{# 새 화면(리뷰 목록 · 업로드 이력 · 상품 비교) 공통 스타일: 사이드바 레이아웃 + 카드 + 필터 + 태그 + 페이지

<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #F5F5F5;
            display: flex;
            height: 100vh;
            color: #333333;
        }

        .sidebar {

            background-color: #ffffff;
            border-right: 1px solid #E0E0E0;

            flex-direction: column;
            justify-content: space-between;

            flex-shrink: 0;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .logo {
            font-size: 15px;
            font-weight: 800;
            color: #111111;
            padding-left: 4px;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background-color: #F8F9FA;
            border-radius: 8px;
        }

        .profile-icon {
            width: 28px;
            height: 28px;
            background-color: #E9ECEF;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .profile-info .shop-name {
            font-size: 12px;
            font-weight: 700;
            color: #111111;
        }

            color: #666666;
        }

            flex-direction: column;
            gap: 4px;

            padding: 10px 12px;
            font-size: 13px;
            color: #555555;

            border-radius: 6px;
            transition: all 0.2s;
        }

        .menu-item.active a, .menu-item a:hover {
            background-color: #F1F3F5;
            color: #111111;
            font-weight: 600;
        }

            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid #E9ECEF;
            padding-top: 16px;

            padding: 40px;
            overflow-y: auto;

            align-items: flex-end;
            margin-bottom: 24px;
        }

        .page-title {

            font-weight: 700;
            color: #111111;
        }

        .page-guide {
            font-size: 13px;
            color: #666666;
        }

            background-color: #ffffff;

        }

            color: #666666;
        }

        }

            border-radius: 10px;
            background-color: #F1F3F5;
            color: #495057;
            font-size: 11px;

        .tag-neg { background-color: #FFF5F5; color: #C92A2A; }
        .tag-neu { background-color: #F1F3F5; color: #495057; }

            padding: 2px 8px;
            border: 1px solid #CED4DA;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-detail:hover {
            border-color: #111111;
        }

            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 16px;
            font-size: 12px;

        .pagination span {
            min-width: 28px;

            text-decoration: none;
            color: #555555;

            background-color: #F1F3F5;
        }

        .pagination .current {
            background-color: #111111;
            color: #ffffff;
            font-weight: 600;
        }

        .tag-done { background-color: #EBFBEE; color: #2B8A3E; }
