<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN POINT REVIEW - 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #F5F5F5;
            display: flex;
            height: 100vh;
            color: #333333;
        }

        /* 사이드바 스타일 */
        .sidebar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #E0E0E0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
        }

        .sidebar-top .logo {
            font-size: 16px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 32px;
            padding-left: 8px;
            letter-spacing: -0.5px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background-color: #F8F9FA;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .profile-icon {
            width: 32px;
            height: 32px;
            background-color: #E9ECEF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .profile-info .shop-name {
            font-size: 13px;
            font-weight: 700;
            color: #111111;
        }

        .profile-info .user-email {
            font-size: 11px;
            color: #666666;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item a {
            display: block;
            padding: 10px 12px;
            font-size: 14px;
            color: #555555;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .menu-item.active a, .menu-item a:hover {
            background-color: #F1F3F5;
            color: #111111;
            font-weight: 600;
        }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 메인 콘텐츠 영역 스타일 */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #111111;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #111111;
        }

        /* 위형 리뷰 경고 박스 */
        .alert-box {
            background-color: #FFF5F5;
            border: 1px solid #FFE3E3;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .alert-text {
            font-size: 14px;
            color: #FA5252;
            font-weight: 600;
        }

        /* 분석 요약 카드 */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-box {
            background-color: #F8F9FA;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666666;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #111111;
        }

        /* 최근 리뷰 리스트 */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-item {
            padding: 12px;
            background-color: #F8F9FA;
            border-radius: 6px;
            font-size: 13px;
            color: #444444;
        }
    </style>
</head>
<body>

    <!-- 사이드바 -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo">PIN POINT REVIEW</div>
            
            <div class="user-profile">
                <div class="profile-icon">👤</div>
                <div class="profile-info">
                    <div class="shop-name">쇼핑몰 이름</div>
                    <div class="user-email">닉네임(이름)</div>
                </div>
            </div>

            <ul class="menu-list">
                <li class="menu-item active"><a href="#">대시보드</a></li>
                <li class="menu-item"><a href="#">상품별 대시보드</a></li>
                <li class="menu-item"><a href="#">상품목록</a></li>
                <li class="menu-item"><a href="#">상품별 리뷰</a></li>
                <li class="menu-item"><a href="#">분석</a></li>
                <li class="menu-item"><a href="#">CS챗봇</a></li>
            </ul>
        </div>

        <div class="sidebar-bottom">
            <ul class="menu-list">
                <li class="menu-item"><a href="#">설정</a></li>
                <li class="menu-item"><a href="#">의견 보내기</a></li>
            </ul>
        </div>
    </aside>

    <!-- 메인 대시보드 화면 -->
    <main class="main-content">
        <h1 class="page-title">[쇼핑몰이름] 대시보드</h1>

        <div class="dashboard-grid">
            <!-- 왼쪽 영역: 위험 리뷰 및 최근 등록된 리뷰 -->
            <div>
                <div class="card">
                    <div class="card-title">🚨 위험 리뷰 감지</div>
                    <div class="alert-box">
                        <span class="alert-text">위험 리뷰 3건이 감지되었습니다. 확인이 필요합니다.</span>
