<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN POINT REVIEW - 회원정보 수정</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #F5F5F5;
            display: flex;
            height: 100vh;
            color: #333333;
        }

        /* 피그마 원본 사이드바 레이아웃 */
        .sidebar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #E0E0E0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            flex-shrink: 0;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .logo {
            font-size: 15px;
            font-weight: 800;
            color: #111111;
            padding-left: 4px;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background-color: #F8F9FA;
            border-radius: 8px;
        }

        .profile-icon {
            width: 28px;
            height: 28px;
            background-color: #E9ECEF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .profile-info .shop-name {
            font-size: 12px;
            font-weight: 700;
            color: #111111;
        }

        .profile-info .user-email {
            font-size: 10px;
            color: #666666;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
        }

        .menu-item a {
            display: block;
            padding: 10px 12px;
            font-size: 13px;
            color: #555555;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .menu-item.active a, .menu-item a:hover {
            background-color: #F1F3F5;
            color: #111111;
            font-weight: 600;
        }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid #E9ECEF;
            padding-top: 16px;
        }

        /* 메인 콘텐츠 영역 */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #111111;
        }

        /* 회원정보 수정 카드 폼 */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            max-width: 640px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: #333333;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #111111;
        }

        .form-group input:disabled {
            background-color: #F8F9FA;
            color: #888888;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }

        .btn-withdraw {
            background: none;
            border: none;
            color: #FA5252;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-save {
            padding: 12px 24px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-save:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <!-- 사이드바 -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo">PIN POINT REVIEW</div>
            
            <div class="user-profile">
                <div class="profile-icon">👤</div>
                <div class="profile-info">
                    <div class="shop-name">쇼핑몰 이름</div>
                    <div class="user-email">닉네임(이름)</div>
                </div>
            </div>

            <ul class="menu-list">
                <li class="menu-item"><a href="#">대시보드</a></li>
                <li class="menu-item"><a href="#">상품 조회</a></li>
                <li class="menu-item"><a href="#">분석</a></li>
                <li class="menu-item"><a href="#">CS챗봇</a></li>
            </ul>
        </div>

        <div class="sidebar-bottom">
            <ul class="menu-list">
                <li class="menu-item active"><a href="#">설정</a></li>
                <li class="menu-item"><a href="#">의견 보내기</a></li>
            </ul>
        </div>
    </aside>

    <!-- 메인 회원정보 수정 화면 -->
    <main class="main-content">
        <h1 class="page-title">회원정보 수정</h1>

        <div class="card">
            <form>
                <div class="form-group">
                    <label for="userid">아이디</label>
                    <input type="text" id="userid" value="pinpoint_user" disabled>
                </div>

                <div class="form-group">
                    <label for="current-pwd">현재 비밀번호</label>
                    <input type="password" id="current-pwd" placeholder="현재 비밀번호를 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="new-pwd">변경할 비밀번호</label>
                    <input type="password" id="new-pwd" placeholder="변경할 비밀번호를 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="shop-name">쇼핑몰 이름</label>
                    <input type="text" id="shop-name" value="피인포인트몰" required>
                </div>

                <div class="form-group">
                    <label for="business-num">사업자번호</label>
                    <input type="text" id="business-num" value="123-45-67890" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-withdraw">회원 탈퇴</button>
                    <button type="submit" class="btn-save">저장하기</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
